<style>
:root{--bg:#f0f2f7;--surface:#fff;--surface2:#f7f8fc;--border:rgba(0,0,0,.08);--text:#0f1523;--muted:#6b7280;--muted2:#9ca3af;--brand:#7c3aed;--brand-soft:rgba(124,58,237,.10);--vid:#7c3aed;--img:#0ea5e9;--good:#059669;--warn:#d97706;--bad:#dc2626;--sh:0 1px 4px rgba(0,0,0,.06);--r:14px}
[data-theme=dark]{--bg:#0a0f1e;--surface:#111827;--surface2:#1a2236;--border:rgba(255,255,255,.09);--text:#f0f4ff;--muted:#8b95a9;--muted2:#5a6478;--brand-soft:rgba(124,58,237,.22);--sh:0 1px 4px rgba(0,0,0,.3)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px 60px}
header{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border)}
.hd{max-width:1240px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hd img{height:26px}.logo-w{display:none}[data-theme=dark] .logo-w{display:block}[data-theme=dark] .logo-p{display:none}
.hd h1{font-size:17px;font-weight:700;margin:0}.hd .sub{color:var(--muted);font-size:13px}
.hd .sp{flex:1}
nav.tabs{display:flex;gap:4px}
nav.tabs a{color:var(--muted);text-decoration:none;font-size:13px;font-weight:600;padding:6px 10px;border-radius:8px}
nav.tabs a:hover{background:var(--surface2);color:var(--text)}
.seg{display:flex;background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:2px}
.seg button{border:0;background:none;color:var(--muted);font:600 12px 'DM Sans';padding:5px 10px;border-radius:7px;cursor:pointer}
.seg button.active{background:var(--brand);color:#fff}
.tbtn{border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:9px;padding:5px 9px;cursor:pointer}
h2{font-size:20px;margin:34px 0 4px}.lead{color:var(--muted);margin:0 0 16px;font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.kpi{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--border);padding:14px 16px;border-top:3px solid var(--brand)}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.kpi .v{font-size:24px;font-weight:700;margin:4px 0 6px}
.kpi .s{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:1px}
.kpi .s b{font-weight:600;color:var(--text)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--border)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:9px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--border)}

th{font-size:12px;color:var(--muted);font-weight:600;cursor:pointer;user-select:none;position:sticky;top:0;background:var(--surface)}
th:hover{color:var(--text)}th.sorted::after{content:attr(data-arrow);margin-left:4px;color:var(--brand)}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--surface2)}
td.n{font-family:'DM Mono',monospace;font-size:13px}
.best{color:var(--good);font-weight:600}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:20px;margin-left:6px;vertical-align:middle}
.t-vid{background:rgba(124,58,237,.12);color:var(--vid)}.t-img{background:rgba(14,165,233,.13);color:var(--img)}

.t-low{background:rgba(217,119,6,.13);color:var(--warn)}
.bars{padding:16px 18px;display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:300px 1fr;gap:12px;align-items:center;font-size:13px}
.bar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .tr{position:relative;height:24px;background:var(--surface2);border-radius:6px}
.bar .fl{height:100%;border-radius:6px}
.bar .lb{position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:600;white-space:nowrap}
.bar .lb.out{color:var(--text)}.bar .lb.in{color:#fff}
.creative{display:grid;grid-template-columns:400px 1fr;gap:24px;padding:20px;margin-bottom:18px;scroll-margin-top:80px}

.media img{cursor:zoom-in}
.info h3{margin:0 0 2px;font-size:18px;word-break:break-word}
.info .meta{color:var(--muted);font-size:13px;margin-bottom:14px}

.ret .tr{height:16px;background:var(--surface2);border-radius:5px;overflow:hidden}
.ret .fl{height:100%;background:var(--vid);border-radius:5px}
.ret .val{font-family:'DM Mono',monospace;font-size:12.5px;text-align:right}
details.tx{border:1px solid var(--border);border-radius:10px;background:var(--surface2)}
details.tx summary{cursor:pointer;padding:10px 14px;font-weight:600;font-size:14px;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.tx summary::after{content:'+';font-size:18px;color:var(--muted)}details.tx[open] summary::after{content:'−'}
.txb{padding:0 14px 14px}
.txb .sw{display:flex;gap:6px;margin-bottom:10px}
.txb .sw button{border:1px solid var(--border);background:var(--surface);color:var(--muted);font:600 12px 'DM Sans';padding:4px 10px;border-radius:7px;cursor:pointer}
.txb .sw button.active{border-color:var(--brand);color:var(--brand)}
.txb p{margin:0 0 8px;font-size:15px;line-height:1.6}
.note{font-size:12.5px;color:var(--muted);margin-top:10px}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:50;cursor:zoom-out}
.lightbox.open{display:flex}.lightbox img{max-height:94vh;max-width:94vw;border-radius:8px}
footer{color:var(--muted2);font-size:12px;text-align:center;margin-top:40px}
@media(max-width:980px){.kpis{grid-template-columns:repeat(3,1fr)}.creative{grid-template-columns:1fr}.media{margin:0 auto}.bar{grid-template-columns:170px 1fr}}
@media(max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)}.mgrid{grid-template-columns:repeat(2,1fr)}nav.tabs{display:none}.bar{grid-template-columns:1fr}.creative{padding:14px}}
</style>
</head>

 case 'spend':case 'cpm':return eur(x[k]);case 'cpl':return x.leads?eur(x.cpl):`<span style="color:var(--muted2)">${t('noLead')}</span>`;

 default:return int(x[k]);}}
function table(){
